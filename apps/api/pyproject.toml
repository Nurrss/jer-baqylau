[project]
name = "jer-api"
version = "0.1.0"
description = "ЖерБақылау API: FastAPI + Telegram bot + scheduler"
authors = [
    { name = "Nursultan", email = "nurrs.serkul@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13",
    "alembic>=1.20.0",
    "apscheduler>=3.11.3",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "fluent-runtime>=0.4.0",
    "geoalchemy2>=0.20.0",
    "httpx>=0.28.1",
    "orjson>=3.12.0",
    "pillow>=12.3.0",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "reportlab>=5.0.1",
    "shapely>=2.1.2",
    "sqlalchemy[asyncio]>=2.0",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.53.0",
]


["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint.per-file-ignores]
# Test doubles must match library signatures (e.g. `timeout` in aiogram sessions).
"tests/*" = ["ASYNC109"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM", "RUF", "N", "C4", "PT"]
ignore = ["RUF001", "RUF002", "RUF003", "B008", "E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["app.domain.*", "app.services.*"]
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
