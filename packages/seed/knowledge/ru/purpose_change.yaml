id: purpose_change
order: 1
emoji: "🔄"
title: Изменение целевого назначения участка
summary: >-
  Если участок нужно использовать иначе, чем указано в документах (например, под магазин вместо ИЖС),
  сначала получите решение местного исполнительного органа об изменении целевого назначения.
steps:
  - Проверьте, допускает ли генеральный план или проект детальной планировки новое назначение участка. Это можно уточнить в отделе архитектуры акимата.
  - Подайте заявление на портале egov.kz (понадобится ЭЦП) или в ЦОН. Укажите кадастровый номер и желаемое назначение.
  - Заявление рассматривает земельная комиссия. При необходимости запрашиваются заключения уполномоченных органов.
  - Акимат принимает решение об изменении целевого назначения либо мотивированно отказывает. Результат приходит в личный кабинет egov.kz.
  - После положительного решения закажите новый идентификационный документ на участок. Изменения регистрируются в Госкорпорации «Правительство для граждан».
documents:
  - Заявление (формируется на egov.kz или в ЦОН)
  - Документ, удостоверяющий личность (для юрлиц — справка о регистрации)
  - Правоустанавливающий документ на участок
  - Идентификационный документ на участок
  - Эскиз или обоснование планируемого использования (если требует комиссия)
terms: Ориентировочно до 1–2 месяцев с учётом работы комиссии. Точный срок указан в карточке услуги на egov.kz.
fee: Решение выдаётся бесплатно. Изготовление нового идентификационного документа — платно, по тарифу Госкорпорации.
where: Портал egov.kz, ЦОН или акимат района (города)
links:
  - title: Портал электронного правительства egov.kz
    url: https://egov.kz
  - title: Госкорпорация «Правительство для граждан»
    url: https://gov4c.kz
note: Использование участка по новому назначению до получения решения считается нарушением (нецелевым использованием).
