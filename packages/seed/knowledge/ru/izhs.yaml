id: izhs
order: 3
emoji: "🏠"
title: Получение участка под ИЖС
summary: >-
  Граждане Казахстана могут бесплатно получить участок для индивидуального жилищного строительства (ИЖС)
  в порядке очереди. Сначала нужно встать в очередь, затем дождаться предоставления участка.
steps:
  - Убедитесь, что у вас нет участка под ИЖС в этом населённом пункте. Право на бесплатное получение предоставляется один раз.
  - Встаньте в очередь на получение участка под ИЖС через egov.kz (понадобится ЭЦП) или в ЦОН. Номер очереди приходит в личный кабинет.
  - Следите за своей позицией в очереди на egov.kz. Когда появятся свободные участки, акимат пришлёт уведомление.
  - Акимат принимает решение о предоставлении участка. Выбор участка проходит в порядке очереди.
  - Закажите идентификационный документ и зарегистрируйте право на участок в Госкорпорации. После этого можно оформлять разрешение на строительство.
documents:
  - Заявление о постановке в очередь (формируется на egov.kz или в ЦОН)
  - Документ, удостоверяющий личность
  - Сведения о семейном положении и составе семьи (если требуется)
terms: Постановка в очередь — несколько рабочих дней. Сам участок предоставляется по мере освоения территорий, сроки ожидания зависят от населённого пункта.
fee: Постановка в очередь и предоставление участка — бесплатно. Изготовление документов — по тарифу Госкорпорации.
where: Портал egov.kz, ЦОН или акимат района (города)
links:
  - title: Портал электронного правительства egov.kz
    url: https://egov.kz
  - title: Госкорпорация «Правительство для граждан»
    url: https://gov4c.kz
note: Полученный участок нужно начать осваивать в установленный срок. Неиспользование участка — основание для проверки.
