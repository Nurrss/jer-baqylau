id: lease_extension
order: 2
emoji: "📝"
title: Продление договора аренды земли
summary: >-
  Договор временного возмездного землепользования (аренды) можно продлить, если участок используется
  по назначению и нет долгов по арендной плате. Заявление подают заранее, до окончания срока аренды.
steps:
  - Проверьте срок окончания договора аренды и отсутствие задолженности по арендной плате. Справку можно получить на egov.kz.
  - Не позднее чем за несколько месяцев до окончания срока подайте заявление о продлении через egov.kz или в акимат (ЦОН).
  - Акимат проверяет, как используется участок. Возможен выезд инспектора.
  - При положительном решении заключается дополнительное соглашение к договору аренды с новым сроком.
  - Зарегистрируйте изменения права аренды в Госкорпорации «Правительство для граждан».
documents:
  - Заявление о продлении срока аренды
  - Документ, удостоверяющий личность (для юрлиц — справка о регистрации)
  - Действующий договор аренды земельного участка
  - Справка об отсутствии задолженности по арендной плате
  - Идентификационный документ на участок
terms: Ориентировочно до 1 месяца. Сверьте с карточкой услуги на egov.kz.
fee: Продление бесплатно. Регистрация изменений — по тарифу Госкорпорации. Арендная плата вносится по договору.
where: Портал egov.kz, ЦОН или акимат района (города)
links:
  - title: Портал электронного правительства egov.kz
    url: https://egov.kz
  - title: Госкорпорация «Правительство для граждан»
    url: https://gov4c.kz
note: Если участок не используется по назначению, в продлении могут отказать. Возможно и изъятие участка в установленном порядке.
