title: Учаскенің нысаналы мақсатын өзгерту
summary: >-
  Учаскені құжаттарда көрсетілгеннен басқаша пайдалану қажет болса (мысалы, ЖТҚ орнына дүкен үшін),
  алдымен жергілікті атқарушы органның нысаналы мақсатты өзгерту туралы шешімін алыңыз.
steps:
  - Бас жоспар немесе егжей-тегжейлі жоспарлау жобасы жаңа мақсатқа жол беретінін тексеріңіз. Мұны әкімдіктің сәулет бөлімінен нақтылауға болады.
  - egov.kz порталында (ЭЦҚ қажет) немесе ХҚКО-да өтініш беріңіз. Кадастрлық нөмірді және қажетті мақсатты көрсетіңіз.
  - Өтінішті жер комиссиясы қарайды. Қажет болса, уәкілетті органдардың қорытындылары сұратылады.
  - Әкімдік нысаналы мақсатты өзгерту туралы шешім қабылдайды немесе дәлелді бас тарту береді. Нәтиже egov.kz жеке кабинетіне келеді.
  - Оң шешімнен кейін учаскеге жаңа сәйкестендіру құжатына тапсырыс беріңіз. Өзгерістер «Азаматтарға арналған үкімет» Мемкорпорациясында тіркеледі.
documents:
  - Өтініш (egov.kz-те немесе ХҚКО-да жасалады)
  - Жеке басын куәландыратын құжат (заңды тұлғалар үшін — тіркеу туралы анықтама)
  - Учаскеге құқық белгілейтін құжат
  - Учаскенің сәйкестендіру құжаты
  - Жоспарланған пайдаланудың эскизі немесе негіздемесі (комиссия талап етсе)
terms: Комиссияның жұмысын ескере отырып, шамамен 1–2 айға дейін. Нақты мерзім egov.kz-тегі қызмет карточкасында көрсетілген.
fee: Шешім тегін беріледі. Жаңа сәйкестендіру құжатын жасау — Мемкорпорация тарифі бойынша ақылы.
where: egov.kz порталы, ХҚКО немесе аудан (қала) әкімдігі
