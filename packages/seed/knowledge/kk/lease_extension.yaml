title: Жерді жалға алу шартын ұзарту
summary: >-
  Уақытша өтеулі жер пайдалану (жалға алу) шартын учаске мақсаты бойынша пайдаланылса және жалдау ақысы
  бойынша берешек болмаса ұзартуға болады. Өтінішті жалға алу мерзімі аяқталғанға дейін алдын ала беріңіз.
steps:
  - Жалға алу шартының аяқталу мерзімін және жалдау ақысы бойынша берешектің жоқтығын тексеріңіз. Анықтаманы egov.kz-тен алуға болады.
  - Мерзім аяқталғанға дейін бірнеше ай бұрын egov.kz арқылы немесе әкімдікке (ХҚКО) ұзарту туралы өтініш беріңіз.
  - Әкімдік учаскенің қалай пайдаланылатынын тексереді. Инспектордың барып шығуы мүмкін.
  - Оң шешім болса, жаңа мерзіммен жалға алу шартына қосымша келісім жасалады.
  - Жалға алу құқығының өзгерістерін «Азаматтарға арналған үкімет» Мемкорпорациясында тіркеңіз.
documents:
  - Жалға алу мерзімін ұзарту туралы өтініш
  - Жеке басын куәландыратын құжат (заңды тұлғалар үшін — тіркеу туралы анықтама)
  - Қолданыстағы жер учаскесін жалға алу шарты
  - Жалдау ақысы бойынша берешектің жоқтығы туралы анықтама
  - Учаскенің сәйкестендіру құжаты
terms: Шамамен 1 айға дейін. egov.kz-тегі қызмет карточкасымен салыстырыңыз.
fee: Ұзарту тегін. Өзгерістерді тіркеу — Мемкорпорация тарифі бойынша. Жалдау ақысы шарт бойынша төленеді.
where: egov.kz порталы, ХҚКО немесе аудан (қала) әкімдігі
links:
