title: ЖТҚ үшін учаске алу
summary: >-
  Қазақстан азаматтары жеке тұрғын үй құрылысы (ЖТҚ) үшін учаскені кезек тәртібімен тегін ала алады.
  Алдымен кезекке тұрып, содан кейін учаске берілуін күту керек.
steps:
  - Осы елді мекенде ЖТҚ үшін учаскеңіз жоқ екеніне көз жеткізіңіз. Тегін алу құқығы бір рет беріледі.
  - egov.kz арқылы (ЭЦҚ қажет) немесе ХҚКО-да ЖТҚ үшін учаске алу кезегіне тұрыңыз. Кезек нөмірі жеке кабинетке келеді.
  - egov.kz-те кезектегі орныңызды бақылаңыз. Бос учаскелер пайда болғанда, әкімдік хабарлама жібереді.
  - Әкімдік учаске беру туралы шешім қабылдайды. Учаскені таңдау кезек тәртібімен жүреді.
  - Сәйкестендіру құжатына тапсырыс беріп, учаскеге құқықты Мемкорпорацияда тіркеңіз. Осыдан кейін құрылысқа рұқсат ресімдеуге болады.
documents:
  - Кезекке қою туралы өтініш (egov.kz-те немесе ХҚКО-да жасалады)
  - Жеке басын куәландыратын құжат
  - Отбасы жағдайы және отбасы құрамы туралы мәліметтер (қажет болса)
terms: Кезекке қою — бірнеше жұмыс күні. Учаскенің өзі аумақтарды игеруге қарай беріледі, күту мерзімі елді мекенге байланысты.
fee: Кезекке қою және учаске беру — тегін. Құжаттарды дайындау — Мемкорпорация тарифі бойынша.
where: egov.kz порталы, ХҚКО немесе аудан (қала) әкімдігі
