name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (ruff · mypy · pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      db:
        image: imresamu/postgis:15-3.4
        env:
          POSTGRES_USER: jer
          POSTGRES_PASSWORD: jer
          POSTGRES_DB: jer
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jer -d jer" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://jer:jer@localhost:5432/jer
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check . ../../scripts
      - run: uv run ruff format --check . ../../scripts
      - run: uv run mypy app
      - run: uv run pytest -q
      - name: OpenAPI contract is up to date
        run: |
          BOT_MODE=disabled uv run python -c "import json; from app.main import create_app; print(json.dumps(create_app().openapi(), ensure_ascii=False, indent=2))" > /tmp/openapi.json
          diff -q /tmp/openapi.json openapi.json || (echo "::error::apps/api/openapi.json is stale — run 'make gen-types' and commit" && exit 1)

  web:
    name: Web (eslint · tsc · vitest · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Frontend types match the OpenAPI contract
        run: |
          npx openapi-typescript ../api/openapi.json -o /tmp/schema.d.ts
          diff -q /tmp/schema.d.ts src/api/schema.d.ts || (echo "::error::schema.d.ts is stale — run 'make gen-types'" && exit 1)
